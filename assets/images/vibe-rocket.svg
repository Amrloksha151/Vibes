<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Rocket</title>
  <desc id="desc">Playful rocket with stars and code symbols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec3750"/>
      <stop offset="100%" stop-color="#ff8c37"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9e8ff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="520" cy="86" r="36" fill="#ffd166" opacity="0.9"/>
  <circle cx="92" cy="98" r="12" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="62" r="7" fill="#fff" opacity="0.8"/>
  <circle cx="194" cy="116" r="10" fill="#fff" opacity="0.7"/>

  <g transform="translate(130 90) rotate(-20 190 140)">
    <ellipse cx="190" cy="140" rx="96" ry="66" fill="url(#rocketBody)" stroke="#338eda" stroke-width="8"/>
    <circle cx="200" cy="132" r="28" fill="#338eda"/>
    <circle cx="200" cy="132" r="15" fill="#a0d8ff"/>
    <path d="M100 160 L56 208 L110 206 Z" fill="#17171d"/>
    <path d="M286 118 L342 80 L316 152 Z" fill="#17171d"/>
    <path d="M148 192 Q190 252 232 192" fill="#ffd166" stroke="#ff8c37" stroke-width="8"/>
    <path d="M174 194 Q190 236 208 194" fill="#ff8c37"/>
  </g>

  <g fill="#fff" font-family="Comic Sans MS, Comic Neue, cursive" font-size="30" font-weight="700">
    <text x="42" y="420">while(alive) { vibe(); ship(); }</text>
  </g>
  <g fill="#17171d" font-family="Comic Sans MS, Comic Neue, cursive" font-size="26" font-weight="700">
    <text x="44" y="70">Vibe Coding Launch Pad</text>
  </g>
</svg>
